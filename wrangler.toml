name = "textfromclip"
account_id = "c3066ec07528b261e192b4530cca58bf"
main = "src/server/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Static Assets (serves built React SPA from ./dist)
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "learnfromclip-db"
database_id = "269a6c4e-3219-4978-b03c-ea02b61761fc"
migrations_dir = "migrations"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Cloudflare R2 Ephemeral Upload Bucket Binding
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "learnfromclip-uploads"

# Environment Variables
[vars]
ENVIRONMENT = "production"
MAX_REQUESTS_PER_MINUTE = "30"
MAX_VIDEO_DURATION_SECONDS = "14400" # 4 hours max
CACHE_TTL_SECONDS = "86400" # 24 hours

