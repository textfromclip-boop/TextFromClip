# Cloudflare Pages configuration (production site: Pages project "textfromclip", Git auto-deploy from main).
# Pages only reads this file when it contains `pages_build_output_dir`; without it, Pages falls back to the
# dashboard build settings (currently "..\dist-pages", which fails with "outside of the repository").
# The standalone Worker deploy uses wrangler.worker.toml (`npm run deploy`).
name = "textfromclip"
pages_build_output_dir = "dist-pages"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "textfromclip-db"
database_id = "0dd853ee-3624-40d3-ba49-a3f41ede2684"
migrations_dir = "migrations"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Cloudflare R2 Ephemeral Upload Bucket Binding
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "textfromclip-uploads"

# Environment Variables (secrets such as COOKIE_SECRET are set in the dashboard, never here)
[vars]
ENVIRONMENT = "production"
MAX_REQUESTS_PER_MINUTE = "30"
MAX_VIDEO_DURATION_SECONDS = "14400"
CACHE_TTL_SECONDS = "86400"
